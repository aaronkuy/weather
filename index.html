<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="weather.js" defer></script>
    <script src="index.js" defer></script>
</head>

<body>
<header class="hero">
    <h1>Weather</h1>
    <p class="tagline">Current weather for any city.</p>
</header>

<form class="weather-form">
    <input type="text" class="cityInput" placeholder="Enter city" aria-label="City" autocomplete="off">
    <button type="submit">Get Weather</button>
</form>

<section class="card" aria-live="polite" hidden></section>

<footer class="footer">
    <a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a> · <a href="https://github.com/aaronkuy/weather">Source on GitHub</a>
</footer>
</body>
</html>
