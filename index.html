<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Inline icon: without one, browsers request /favicon.ico and log a 404. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9B%85%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="weather.js" defer></script>
    <script src="index.js" defer></script>
</head>

<body>
<header class="hero">
    <h1>Weather</h1>
    <p class="tagline">Current weather for any city.</p>
</header>

<form class="weather-form">
    <input type="text" class="cityInput" placeholder="Enter city" aria-label="City" autocomplete="off">
    <button type="submit">Get Weather</button>
</form>

<section class="card" aria-live="polite" hidden></section>

<footer class="footer">
    <a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a> · <a href="https://github.com/aaronkuy/weather">Source on GitHub</a>
</footer>
</body>
</html>
